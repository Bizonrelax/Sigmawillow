  {id:36, object:"примитивные пары", relation:"крупные чистые II при n = 20", characteristic:"структура", method:"динамическое программирование", status:"эмпирически подтверждено", text:"Для W = 9012, 9570, 9712 при n = 20 каждая коллизия имеет вид: A = почти все девятки с крошечным хвостом из {1,2,7,8}, B = только из {6,7}. Пример W = 9012: A = 13×9 + {8,2,1,1,1}, S_A = 130, Q_A = 1124; B = 11×7 + 9×6, S_B = 131, Q_B = 863. В каждой паре S_B − S_A = 1"},

function uniqueValues(arr, field) {
  const set = new Set();
  for (const item of arr) if (item[field]) set.add(item[field]);
  return [...set].sort((a, b) => a.localeCompare(b, "ru"));
}

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  for (const v of values) {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    sel.appendChild(opt);
  }
}

fillSelect("filter-object", uniqueValues(data, "object"));
fillSelect("filter-relation", uniqueValues(data, "relation"));
fillSelect("filter-characteristic", uniqueValues(data, "characteristic"));
fillSelect("filter-method", uniqueValues(data, "method"));
fillSelect("filter-status", uniqueValues(data, "status"));

function statusClass(s) {
  if (!s) return "";
  if (s.indexOf("определение") >= 0) return "status-def";
  if (s.indexOf("доказано") >= 0) return "status-proven";
  if (s.indexOf("эмпирически") >= 0) return "status-emp";
  if (s.indexOf("гипотеза") >= 0) return "status-hyp";
  if (s.indexOf("открыто") >= 0) return "status-open";
  if (s.indexOf("опровергнуто") >= 0) return "status-refuted";
  return "";
}

function applyFilters() {
  const fObj = document.getElementById("filter-object").value;
  const fRel = document.getElementById("filter-relation").value;
  const fChar = document.getElementById("filter-characteristic").value;
  const fMeth = document.getElementById("filter-method").value;
  const fStat = document.getElementById("filter-status").value;
  const fText = document.getElementById("filter-text").value.toLowerCase();

  const filtered = data.filter(function(item) {
    if (fObj && item.object !== fObj) return false;
    if (fRel && item.relation !== fRel) return false;
    if (fChar && item.characteristic !== fChar) return false;
    if (fMeth && item.method !== fMeth) return false;
    if (fStat && item.status !== fStat) return false;
    if (fText && item.text.toLowerCase().indexOf(fText) < 0) return false;
    return true;
  });

  renderRows(filtered);
  document.getElementById("count").textContent =
    "Найдено: " + filtered.length + " из " + data.length;
}

function renderRows(rows) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + r.id + "</td>" +
      "<td>" + r.object + "</td>" +
      "<td>" + r.relation + "</td>" +
      "<td>" + r.characteristic + "</td>" +
      "<td>" + r.method + "</td>" +
      "<td class='" + statusClass(r.status) + "'>" + r.status + "</td>" +
      "<td>" + r.text + "</td>";
    tbody.appendChild(tr);
  }
}

const sortDirection = {};
function sortBy(field) {
  sortDirection[field] = !sortDirection[field];
  const dir = sortDirection[field] ? 1 : -1;
  data.sort(function(a, b) {
    const av = a[field] || "";
    const bv = b[field] || "";
    if (typeof av === "number" && typeof bv === "number") return dir * (av - bv);
    return dir * String(av).localeCompare(String(bv), "ru");
  });
  applyFilters();
}

function resetFilters() {
  document.getElementById("filter-object").value = "";
  document.getElementById("filter-relation").value = "";
  document.getElementById("filter-characteristic").value = "";
  document.getElementById("filter-method").value = "";
  document.getElementById("filter-status").value = "";
  document.getElementById("filter-text").value = "";
  applyFilters();
}

const selectIds = ["filter-object", "filter-relation", "filter-characteristic", "filter-method", "filter-status"];
for (const id of selectIds) {
  document.getElementById(id).addEventListener("change", applyFilters);
}
document.getElementById("filter-text").addEventListener("input", applyFilters);

applyFilters();
</script>
